# PhysicsTA v2 — one DB for everything (Postgres + pgvector) + FastAPI backend.
# The React frontend (reused from ../physics-ta/frontend) is run separately and
# proxies /api -> the api service on port 3001 (handoff §5/§11.1).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: physicsta
      POSTGRES_PASSWORD: physicsta
      POSTGRES_DB: physicsta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physicsta"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://physicsta:physicsta@db:5432/physicsta
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USE_DOCLING: ${USE_DOCLING:-false}
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      # Persist downloaded embedding + reranker weights across restarts.
      - models:/models
      - ./backend/uploads:/app/uploads

volumes:
  pgdata:
  models:
